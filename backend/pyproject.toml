[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-ai-live-clipper"
version = "0.1.0"
description = "Real-time highlight detection and vertical clip generation for YouTube, Twitch and Kick live streams"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "websockets>=12",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "av>=12",
  "faster-whisper>=1.0",
  "streamlink>=6.8",
  "yt-dlp>=2024.8.0",
  "psutil>=5.9",
  "cryptography>=42",
  "scikit-learn>=1.4",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
redis = ["redis>=5"]
postgres = ["asyncpg>=0.29"]
gpu = ["nvidia-ml-py>=12"]
fonts = ["fonttools[woff]>=4.50"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fonttools[woff]>=4.50", "redis>=5"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.setuptools.package-data]
clipper = ["analysis/lexicons/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
